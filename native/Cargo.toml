[workspace]
resolver = "3"
members = ["dj_domain", "dj_engine", "dj_infra", "dj_api", "test_support"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/andersonKoffi/platine"
publish = false

[workspace.dependencies]
# Internal crates
dj_domain = { path = "dj_domain" }
dj_engine = { path = "dj_engine" }
dj_infra = { path = "dj_infra" }
test_support = { path = "test_support" }

# Bridge (must match the Dart package version exactly)
flutter_rust_bridge = "=2.13.0"

# Errors
thiserror = "2.0.21"
anyhow = "1.0.104"

# Testing
proptest = "1.12.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# Audio code must stay fast in debug builds too (tests, offline renders).
[profile.dev.package."*"]
opt-level = 2
