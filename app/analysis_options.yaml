include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - lib/src/rust/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - rust_builder/**
    - build/**
    - macos/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # This is an application, not a published package.
    public_member_api_docs: false
