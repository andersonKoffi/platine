name: platine
description: "Platine — a beautiful, fun DJ app for macOS."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.50.0"

dependencies:
  desktop_drop: ^0.9.2
  # Builds and links the Rust engine (native/dj_api) through cargokit.
  dj_api:
    path: rust_builder
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  # Must match the Rust crate version exactly (see native/Cargo.toml).
  flutter_rust_bridge: 2.13.0
  freezed_annotation: ^3.1.0
  material_ui: ^1.11.0
  riverpod_annotation: ^4.0.8
  shared_preferences: ^2.5.6

dev_dependencies:
  build_runner: ^2.17.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.10
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  fonts:
    # Space Grotesk, SIL Open Font License 1.1 (assets/fonts/SpaceGrotesk-OFL.txt).
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
